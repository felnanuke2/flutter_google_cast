name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - all
          - flutter_chrome_cast_platform_interface
          - flutter_chrome_cast_android
          - flutter_chrome_cast_ios
          - flutter_chrome_cast

permissions:
  id-token: write

jobs:
  publish-platform-interface:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.package == 'all' ||
      github.event.inputs.package == 'flutter_chrome_cast_platform_interface'
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/flutter_chrome_cast_platform_interface

  publish-android:
    needs: publish-platform-interface
    if: >-
      always() &&
      (github.event_name == 'push' ||
       github.event.inputs.package == 'all' ||
       github.event.inputs.package == 'flutter_chrome_cast_android')
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/flutter_chrome_cast_android

  publish-ios:
    needs: publish-platform-interface
    if: >-
      always() &&
      (github.event_name == 'push' ||
       github.event.inputs.package == 'all' ||
       github.event.inputs.package == 'flutter_chrome_cast_ios')
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/flutter_chrome_cast_ios

  publish-root:
    needs: [publish-android, publish-ios]
    if: >-
      always() &&
      (github.event_name == 'push' ||
       github.event.inputs.package == 'all' ||
       github.event.inputs.package == 'flutter_chrome_cast')
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: .
